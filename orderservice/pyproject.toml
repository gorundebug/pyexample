[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.2",
  "pyservicelib-gorundebug",
  "grpcio>=1.65.0",
  "protobuf>=6.31.1",
  "inventory_service_api",
  "model",
  "order_service_api",
]

[tool.uv.sources]
inventory_service_api = { workspace = true }
model = { workspace = true }
order_service_api = { workspace = true }


[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["order_service"]