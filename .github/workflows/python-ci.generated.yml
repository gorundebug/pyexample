name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: ./scripts/python/setup.generated.sh
      - run: ./scripts/python/typecheck.generated.sh
      - run: ./scripts/python/test.generated.sh

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/python/integration-test.generated.sh