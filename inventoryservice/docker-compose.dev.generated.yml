services:
  inventoryservice:
    image: inventoryservice-python-development:latest
    working_dir: /workspace/service
    command:
      - /bin/sh
      - -c
      - |
        prepare-local-build /workspace/source /workspace/service
        cd /workspace/service
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec python -m debugpy --listen 0.0.0.0:2345 -m inventory_service.main --config ./config/config.yaml --overrides ./config/docker_overrides.yaml
        fi
        exec python -m inventory_service.main --config ./config/config.yaml --overrides ./config/docker_overrides.yaml
    environment:
      PYTHONPATH: /workspace/service/src
    ports:
      - "${DEBUG_PORT:-2345}:2345"
    volumes:
      - .:/workspace/source:ro
      - python-worktree:/workspace/service

volumes:
  python-worktree: