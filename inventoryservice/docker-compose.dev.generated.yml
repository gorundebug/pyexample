services:
  inventoryservice:
    image: inventoryservice-python-development:latest
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec python -m debugpy --listen 0.0.0.0:2345 -m inventory_service.main --config /workspace/config/config.yaml --overrides /workspace/config/docker_overrides.yaml
        fi
        exec python -m inventory_service.main --config /workspace/config/config.yaml --overrides /workspace/config/docker_overrides.yaml
    volumes:
      - .:/workspace:ro
      - /workspace/.venv