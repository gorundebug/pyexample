[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory_service"
version = "0.2.66"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.2",
  "pyservicelib-gorundebug",
  "grpcio>=1.65.0",
  "protobuf>=6.31.1",
  "inventory_service_api",
  "model",
]
[tool.uv.sources]
pyservicelib-gorundebug = { git = "https://github.com/gorundebug/pyservicelib.git", tag = "v0.2.66" }
inventory_service_api = { workspace = true }
model = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "types-protobuf>=6.30.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inventory_service"]

[[tool.mypy.overrides]]
module = ["*.generated.*"]
ignore_errors = true