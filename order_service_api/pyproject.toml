[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order_service_api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.2",
]

[project.optional-dependencies]
codegen = [
  "datamodel-code-generator==0.70.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_service_api"]

[tool.hatch.build]
artifacts = [
  "src/order_service_api/generated/**/*.py",
  "src/order_service_api/generated/**/*.pyi",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
