[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory_service_api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.81.0",
  "protobuf>=6.33.5",
]

[project.optional-dependencies]
codegen = [
  "grpcio-tools==1.81.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_service_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]