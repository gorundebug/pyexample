[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory_service_api"
version = "0.2.92"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.81.0",
  "protobuf>=6.33.5",
]

[project.optional-dependencies]
codegen = [
  "grpcio-tools==1.81.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_service_api"]
# Generated transport bindings are build artifacts: they are intentionally
# excluded from Git, but must be included in the distributable wheel after
# generate.generated.sh has materialized them from the source contracts.
[tool.hatch.build]
artifacts = [
  "src/inventory_service_api/generated/**/*.py",
  "src/inventory_service_api/generated/**/*.pyi",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]