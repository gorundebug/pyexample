services:
  analyticsservice:
    image: example-python:latest
    build:
      context: .
      dockerfile: Dockerfile.python
      target: ${SERVICEGEN_DOCKER_TARGET:-development}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
      additional_contexts:
        pyservicelib-source: "${PYSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/pyservicelib.git#v0.2.8}"
    command:
      - python
      - -m
      - analytics_service.main
      - --config
      - /workspace/analyticsservice/config/config.yaml
      - --overrides
      - /workspace/analyticsservice/config/docker_overrides.yaml
    volumes:
      - .:/workspace
      - /workspace/.venv
      - /workspace/inventory_service_api/src/inventory_service_api/generated
      - /workspace/model/src/model/generated
      - /workspace/order_service_api/src/order_service_api/generated
    restart: unless-stopped
    environment:
      - DEBUG=${ANALYTICS_SERVICE_DEBUG:-0}
    ports:
      - "9093:9093"
      - "9203:9203"
      - "2345:2345"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    networks:
      - app_net

  inventoryservice:
    image: example-python:latest
    build:
      context: .
      dockerfile: Dockerfile.python
      target: ${SERVICEGEN_DOCKER_TARGET:-development}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
      additional_contexts:
        pyservicelib-source: "${PYSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/pyservicelib.git#v0.2.8}"
    command:
      - python
      - -m
      - inventory_service.main
      - --config
      - /workspace/inventoryservice/config/config.yaml
      - --overrides
      - /workspace/inventoryservice/config/docker_overrides.yaml
    volumes:
      - .:/workspace
      - /workspace/.venv
      - /workspace/inventory_service_api/src/inventory_service_api/generated
      - /workspace/model/src/model/generated
      - /workspace/order_service_api/src/order_service_api/generated
    restart: unless-stopped
    environment:
      - DEBUG=${INVENTORY_SERVICE_DEBUG:-0}
    ports:
      - "9092:9092"
      - "9202:9202"
      - "2346:2345"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    networks:
      - app_net

  orderservice:
    image: example-python:latest
    build:
      context: .
      dockerfile: Dockerfile.python
      target: ${SERVICEGEN_DOCKER_TARGET:-development}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
      additional_contexts:
        pyservicelib-source: "${PYSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/pyservicelib.git#v0.2.8}"
    command:
      - python
      - -m
      - order_service.main
      - --config
      - /workspace/orderservice/config/config.yaml
      - --overrides
      - /workspace/orderservice/config/docker_overrides.yaml
    volumes:
      - .:/workspace
      - /workspace/.venv
      - /workspace/inventory_service_api/src/inventory_service_api/generated
      - /workspace/model/src/model/generated
      - /workspace/order_service_api/src/order_service_api/generated
    restart: unless-stopped
    environment:
      - DEBUG=${ORDER_SERVICE_DEBUG:-0}
    ports:
      - "9091:9091"
      - "9201:9201"
      - "2347:2345"
    depends_on:
      - inventoryservice
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    networks:
      - app_net


  redpanda:
    image: redpandadata/redpanda:v24.2.5
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    networks:
      - app_net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app_net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./analyticsservice/grafana/dist:/etc/grafana/dashboards/analyticsservice:ro
      - ./inventoryservice/grafana/dist:/etc/grafana/dashboards/inventoryservice:ro
      - ./orderservice/grafana/dist:/etc/grafana/dashboards/orderservice:ro
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  grafana_data: