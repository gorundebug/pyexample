services:
  analyticsservice:
    image: analyticsservice-python-development:latest
    command:
      - /bin/sh
      - -lc
      - |
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec python -m debugpy --listen 0.0.0.0:2345 -m analytics_service.main --config /workspace/config/config.yaml --overrides /workspace/config/docker_overrides.yaml
        fi
        exec python -m analytics_service.main --config /workspace/config/config.yaml --overrides /workspace/config/docker_overrides.yaml
    volumes:
      - .:/workspace
      - /workspace/.venv