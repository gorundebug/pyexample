[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.2",
  "pyservicelib-gorundebug",
  "aiokafka>=0.12.0",
  "model",
]

[tool.uv.sources]
model = { workspace = true }


[tool.hatch.build.targets.wheel]
packages = ["src/analytics_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["analytics_service"]