[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.2",
  "pyservicelib-gorundebug",
  "aiokafka>=0.12.0",
  "model",
]

[tool.uv.sources]
pyservicelib-gorundebug = { git = "https://github.com/gorundebug/pyservicelib.git", tag = "v0.2.20" }
model = { path = ".servicegen/dependencies/model" }

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "types-protobuf>=6.30.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["analytics_service"]

[[tool.mypy.overrides]]
module = ["*.generated.*"]
ignore_errors = true