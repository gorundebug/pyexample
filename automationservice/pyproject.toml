[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.2",
  "pyservicelib-gorundebug",
  "APScheduler==3.11.3",
  "temporalio==1.31.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/automation_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["automation_service"]