[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
codegen = [
]

[tool.hatch.build.targets.wheel]
packages = ["src/model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]