python-quality:
  image: ghcr.io/astral-sh/uv:0.12.7-python3.12-bookworm-slim
  stage: quality
  script:
    - ./scripts/python/setup.generated.sh
    - ./scripts/python/typecheck.generated.sh
    - ./scripts/python/test.generated.sh

python-integration:
  image: docker:29.7.2-cli
  stage: integration
  services:
    - docker:29.7.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash python3
  script:
    - ./scripts/python/integration-test.generated.sh